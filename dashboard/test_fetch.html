<!DOCTYPE html>
<html>
<head><title>Test Fetch</title></head>
<body>
<h3>Testing price fetch for BRACBANK</h3>
<button onclick="test()">Test Fetch</button>
<pre id="out">Click button...</pre>
<script>
function test() {
    const url = '/dashboard/run_price_update.php?type=one&sym=BRACBANK&exch=DSE&mkt=BD';
    document.getElementById('out').textContent = 'Fetching: ' + url + '\n';
    fetch(url)
        .then(r => {
            document.getElementById('out').textContent += 'HTTP status: ' + r.status + '\n';
            document.getElementById('out').textContent += 'Content-Type: ' + r.headers.get('content-type') + '\n';
            return r.text(); // Get as text first to see raw response
        })
        .then(text => {
            document.getElementById('out').textContent += 'Raw response:\n' + text + '\n\n';
            try {
                const data = JSON.parse(text);
                document.getElementById('out').textContent += 'Parsed OK!\n';
                document.getElementById('out').textContent += 'results.length: ' + (data.results||[]).length + '\n';
                if (data.results && data.results.length > 0) {
                    document.getElementById('out').textContent += '✅ SUCCESS: ' + data.results[0].symbol + ' = ' + data.results[0].new_price;
                } else {
                    document.getElementById('out').textContent += '❌ No results. Errors: ' + JSON.stringify(data.errors);
                }
            } catch(e) {
                document.getElementById('out').textContent += '❌ JSON parse error: ' + e.message;
            }
        })
        .catch(e => {
            document.getElementById('out').textContent += '❌ Fetch error: ' + e.message;
        });
}
</script>
</body>
</html>
